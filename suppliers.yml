# P+M shop – konfigurace dodavatelů pro převod feedů do Shoptetu
#
# Každý dodavatel = jeden blok pod "suppliers". Výstup: docs/<id>.xml
# URL feedu se NEPÍŠE sem (repozitář je veřejný), ale do GitHub secretu FEED_URLS:
#   {"vo-partner": "https://feeds.mergado.com/...", "dalsi-dodavatel": "https://..."}
#
# Pravidla kategorií se vyhodnocují shora dolů, platí první, které pasuje.
# Podmínky (regulární výrazy, nezáleží na velikosti písmen):
#   code – kód produktu, name – název, category – kategorie dodavatele, manufacturer – výrobce
# Když je v pravidle víc podmínek, musí platit všechny.

defaults:
  fallback_category: "Ke kontrole"   # tuto kategorii v Shoptetu jednou skryjte
  min_items: 10                      # když feed dodavatele přijde (skoro) prázdný, výstup se nepřepíše
  pricing:
    use_rrp: true          # použít doporučenou prodejní cenu dodavatele, pokud ji posílá
    rrp_min_ratio: 1.3     # ...ale jen když je aspoň 1,3× nákupní cena
    coef: 1.15             # jinak: nákupní cena bez DPH × 1,15 (marže 15 %) + DPH
    rounding: whole        # nines = ...9 Kč, whole = celé Kč nahoru, none = bez zaokrouhlení
    # produkty s nákupní cenou 0 (nebo bez ní) se z feedu vyřazují
    vat_default: 21
    publish_purchase_price: false   # feed je veřejný – nákupní ceny do něj nedáváme
  # Zboží jen pro dospělé (pravidla adult_rules u dodavatele): dostane příznak ADULT,
  # upozornění na začátek popisu a navíc se zařadí do kategorie 18+ (na ni se v Shoptetu
  # napojí doplněk na ověření věku v košíku).
  adult_category: "Pouze pro dospělé 18+"
  adult_notice: "<p><strong>Prodej osobám mladším 18 let je zakázán.</strong> Před dokončením objednávky ověříme váš věk a zásilku nelze předat osobě mladší 18 let.</p>"

suppliers:

  vo-partner:
    supplier_name: "VO partner (Conectiv)"
    item_tag: item
    fields:
      code: code
      ean: ean
      name: PRODUCTNAME
      description: DESCRIPTION
      manufacturer: MANUFACTURER
      image: IMGURL
      stock: inStock
      purchase_price: price      # VO cena bez DPH
      rrp: DMOC                  # doporučená MOC s DPH
      vat: VAT
      weight_g: VAHA
      category: CATEGORYTEXT
      gpsr: GPSR
    skip:
      names: ["Název"]           # neúplné položky bez dat
      codes: ["ESV032"]          # chybně spárovaný produkt ve feedu dodavatele
    vat_map:
      "15": 21                   # sazba 15 % už neexistuje
    pricing:                     # VO partner: marže aspoň 30 % nad nákupní cenou
      coef: 1.30                 # nákup bez DPH × 1,30 + DPH
      coef_is_minimum: true      # doporučená cena jen když je vyšší než nákup + 30 % + DPH
    name_fixes:
      "Batereie": "Baterie"
      "Bazerie": "Baterie"
      "Wilkinosn": "Wilkinson"
      "- ednorázový": "- jednorázový"
      "Energizer Energizer": "Energizer"
      "Lahtern": "Lantern"
      "Hydratation": "Hydration"
      "Buble Gum": "Bubble Gum"
    text_fixes:
      "Něměcko": "Německo"
    manufacturer_map:
      "Armor ALL Red bull": "Armor All"
      "California scents": "California Scents"
      "Bulldog skincare": "Bulldog Skincare"
      "Wilkinson sword": "Wilkinson Sword"
      "Hawaiian tropic": "Hawaiian Tropic"
    categories:
      # --- Auto-moto › Vůně do auta
      - {code: "^(CSV|JBHG|CSP|AA00[1-6])", path: "Auto-moto > Vůně do auta > Závěsné vůně"}
      - {code: "^(CSS|JBVS|AA00[78])",      path: "Auto-moto > Vůně do auta > Vůně do ventilace"}
      - {code: "^CSC",                      path: "Auto-moto > Vůně do auta > Vůně v plechovce"}
      - {code: "^CSD",                      path: "Auto-moto > Vůně do auta > Difuzéry"}
      - {category: "Vůně do auta",          path: "Auto-moto > Vůně do auta"}
      # --- Baterie a svítilny
      - {code: "^EZA",          path: "Baterie a svítilny > Baterie > Baterie do naslouchadel"}
      - {code: "^(ECR|ESA)",    path: "Baterie a svítilny > Baterie > Knoflíkové a speciální baterie"}
      - {code: "^EL",           path: "Baterie a svítilny > Baterie > Lithiové baterie"}
      - {code: "^EN",           path: "Baterie a svítilny > Nabíječky a akumulátory"}
      - {code: "^(E[EUMBC]|EV)", path: "Baterie a svítilny > Baterie > Alkalické baterie"}
      - {code: "^ESV", name: "čelov",                         path: "Baterie a svítilny > Svítilny > Čelovky"}
      - {code: "^ESV", name: "lucerna|tripod|spot|inspection", path: "Baterie a svítilny > Svítilny > Pracovní a kempinková světla"}
      - {code: "^ESV",          path: "Baterie a svítilny > Svítilny > Ruční svítilny"}
      # --- Drogerie a kosmetika
      - {code: "^HT",           path: "Drogerie a kosmetika > Opalování"}
      - {code: "^BDK",          path: "Drogerie a kosmetika > Péče o pleť"}
      - {code: "^BDV", name: "beard|vous",                         path: "Drogerie a kosmetika > Péče o vousy"}
      - {code: "^BDV", name: "gel|soap|aftershave|mýdlo|balzám po", path: "Drogerie a kosmetika > Holení > Péče při holení"}
      - {code: "^BDV",          path: "Drogerie a kosmetika > Holení > Holicí strojky a hlavice"}
      - {code: "^BDT", name: "deo", path: "Drogerie a kosmetika > Deodoranty"}
      - {code: "^BDT",          path: "Drogerie a kosmetika > Vlasy a tělo"}
      - {code: "^W", name: "zastřihovač|styler|zarovnávač", path: "Drogerie a kosmetika > Holení > Zastřihovače a zarovnávače"}
      - {code: "^W",            path: "Drogerie a kosmetika > Holení > Holicí strojky a hlavice"}

  # ------------------------------------------------------------------ Bohemia Gifts
  # Google Shopping feed jejich e-shopu (veřejná adresa, proto je přímo tady).
  # Ceny ve feedu = ceny pro koncového zákazníka s DPH; g:mpn = jejich SKU pro objednání.
  # Vyprodané / vyřazené zboží z feedu mizí -> převodník ho nechá se skladem 0 (keep_missing_days).
  bohemia-gifts:
    supplier_name: "Bohemia Gifts"
    url: "https://bohemiagifts.cz/wp-content/uploads/woo-feed/google/xml/googleshopping.xml"
    namespaces: {g: "http://base.google.com/ns/1.0"}
    item_tag: item
    code_prefix: "BG-"            # aby se kódy nepletly s jinými dodavateli
    min_items: 100
    fields:
      code: "g:mpn"
      code_fallback: "g:id"       # 11 položek nemá mpn
      ean: "g:gtin"
      name: "g:title"
      description: "g:description"
      manufacturer: "g:brand"
      image: ["g:image_link", "g:additional_image_link"]
      stock: "g:availability"
      price_vat: "g:price"
      sale_price_vat: "g:sale_price"
      category: "g:product_type"
    stock_map:
      in_stock: 5                 # feed neposílá počet kusů, jen "skladem"
      out_of_stock: 0
      preorder: 0
      backorder: 0
    pricing:
      mode: retail                # prodejní cena = cena dodavatele pro koncového zákazníka
      use_sale_price: true        # když mají akci, prodáváme za akční cenu
      retail_coef: 1.0            # např. 1.05 = o 5 % dráž, 0.95 = o 5 % levněji
      vat_default: 21
    exclude:
      - {text: "s vlastním potiskem|s vlastní etiketou|vlastní fotograf|personaliz", reason: "personalizovaný produkt (nutné zadání od zákazníka)"}
      - {name: "trič|mikin|\\bbody\\b|bodýč", reason: "oblečení – feed neobsahuje velikosti"}
      - {name: "medovin", text: "1[5-9] ?%|[2-9]\\d ?%", reason: "medovina s 15 % a více alkoholu – možná lihovina (koncese/kolky), do vyjasnění vyřazeno"}
    categories:
      - {category: "bedny a koše|kufřík", path: "Dárky a dekorace > Dárkové bedny a sady"}
      - {manufacturer: "Daruj Bednu", path: "Dárky a dekorace > Dárkové bedny a sady"}
      - {category: "Hrnky|Půllitry|Placatky|Otvíráky|skleničky a panáky", path: "Dárky a dekorace > Hrnky, půllitry a placatky"}
      - {name: "\\bvín[oa]\\b|medovin|prosecco|sekt\\b|\\bpiv[oa]\\b.*\\d+[,.]?\\d*\\s?l\\b|ležák|likér|slivovic", text: "\\d+[,.]?\\d*\\s?m?l\\b", path: "Dárky a dekorace > Víno a alkohol 18+", vat: 21}
      - {name: "klíčenk|button|placka", path: "Dárky a dekorace > Klíčenky a placky"}
      - {category: "Energetické nápoje", path: "Dárky a dekorace > Čaje a nápoje", vat: 21}
      - {category: "čaje", path: "Dárky a dekorace > Čaje a nápoje", vat: 12}
      - {category: "Cukrovinky|čokolád|Bonbóny|Sušenky|sladkosti", path: "Dárky a dekorace > Sladkosti", vat: 12}
      - {category: "Kosmetik|mýdla|koupel|Sprchové gely|šampon|bomby", path: "Dárky a dekorace > Kosmetika a mýdla"}
      - {category: "svíčk|svícn|difuzér|vonítk|vonné", path: "Dárky a dekorace > Svíčky a vůně"}
      - {category: "Vánoční dekorace|vánoční ozdoby", path: "Dárky a dekorace > Vánoční dekorace"}
      - {category: "Přání|Balící papír", path: "Dárky a dekorace > Přání a balení dárků"}
      - {category: "Textil|tašky|Batohy", path: "Dárky a dekorace > Tašky a textil"}
      - {category: "Dekorace|Rámečky|Samolepky|hodiny|zápichy|srdce", path: "Dárky a dekorace > Dekorace do bytu"}
    fallback_category: "Dárky a dekorace > Další dárky"
    # alkohol: samotné nápoje + dárkové bedny/sady, ve kterých je víno, prosecco, pivo nebo medovina
    adult_rules:
      # samotné nápoje (název + objem), ne příslušenství k vínu
      - {name: "^(?!.*(otvír|vývrt|držák|stojan|krájen|sklenic|obraz|cedul|kosmet|sprchov|šampon|mýdl|lázeň|koupel)).*(\\bvín[oa]\\b|\\bpiv[oa]\\b|medovin|prosecco|sekt\\b|ležák|likér|slivovic|pálenk|\\brum\\b|whisk|vodk)", text: "\\d+[,.]?\\d*\\s?m?l\\b|láhev|lahev|lahv"}
      # dárkové bedny a sady, které alkohol obsahují
      - {name: "^(?!.*(kosmet|sprchov|šampon|mýdl|lázeň|koupel|otvír|krájen)).*(bedn|koš|kufřík|sada|box|balíček)", text: "(červeným|bílým|šumivým|růžovým) vínem|s vínem|šumivé víno|víno [A-ZÁČĎÉĚÍŇÓŘŠŤÚŮÝŽ]|víno \\d|prosecc|medovin|lahvov\\w* piv|piv[oa] \\d|s pivem|ležák"}

  # ------------------------------------------------------------------ Automotochemie (Drive)
  # Velkoobchodní feed (adresa obsahuje přístupový klíč -> GitHub secret FEED_URL_AUTOMOTOCHEMIE).
  # PRICE = nákupní cena bez DPH, PRICE_VAT = jen PRICE × 1,21 (doporučenou cenu feed neposílá),
  # proto se prodejní cena počítá z nákupní (defaults.pricing: +15 % + DPH).
  # Štítky PŘIPRAVUJEME / VÝPRODEJ / NOVINKY / PROMO AKCE nejsou kategorie – pravidla je ignorují.
  automotochemie:
    supplier_name: "Automotochemie (Drive)"
    item_tag: SHOPITEM
    code_prefix: "AC-"
    min_items: 100
    strip_styles: true
    fields:
      code: PRODUCTCODE
      ean: EAN
      name: PRODUCT
      description: DET_DESCRIPTION
      description_fallback: DESCRIPTION
      short_description: DESCRIPTION
      manufacturer: MANUFACTURER
      image: IMGURL
      stock: INSTOCK
      purchase_price: PRICE
      vat: VAT
      category: CATEGORYTEXT
    stock_map:
      ano: 5                      # feed posílá jen Ano/Ne
      ne: 0
    pricing:
      use_rrp: false
    manufacturer_map:
      "L&amp;D Aromaticos": "L&D Aromaticos"
    exclude:
      - {text: "UKONČENÝ PRODEJ", reason: "ukončený prodej"}
      - {name: "ZMĚNA KODU", reason: "starý kód – produkt je ve feedu pod novým kódem"}
      - {name: "^[A-Z0-9_]+$", reason: "chybí název (jen kód)"}
    categories:
      # --- Vůně do auta
      - {category: "Organic Can|Gelové osvěžovače", path: "Auto-moto > Vůně do auta > Vůně v plechovce"}
      - {category: "Papírové osvěžovače|Little Bottle", path: "Auto-moto > Vůně do auta > Závěsné vůně"}
      - {category: "Kolíčky do ventilace", path: "Auto-moto > Vůně do auta > Vůně do ventilace"}
      - {category: "Osvěžovače vzduchu", path: "Auto-moto > Vůně do auta"}
      # --- Autoklimatizace
      - {category: "Autoklimatizace", path: "Auto-moto > Autoklimatizace"}
      # --- Autokosmetika
      - {category: "Autokosmetika \\| Šampóny", path: "Auto-moto > Autokosmetika > Mytí a šampony"}
      - {category: "Autokosmetika \\| (Vosky|Leštěnky)", path: "Auto-moto > Autokosmetika > Vosky a leštěnky"}
      - {category: "Autokosmetika \\| Interiér", path: "Auto-moto > Autokosmetika > Péče o interiér"}
      - {category: "Autokosmetika \\| Čističe a impregnace", path: "Auto-moto > Autokosmetika > Čističe a impregnace"}
      - {category: "Autokosmetika \\| Aplikace", path: "Auto-moto > Autokosmetika > Houby, utěrky a aplikátory"}
      - {category: "Údržba kabrioletu|Údržba motocyklu|Dárkové kazety|Autokosmetika", path: "Auto-moto > Autokosmetika"}
      # --- Autochemie
      - {category: "Aditiva|Dekarbonizace", path: "Auto-moto > Autochemie > Aditiva do paliva"}
      - {category: "\\| Motor\\b|Převodovka|Posilovač řízení", path: "Auto-moto > Autochemie > Motor a převodovka"}
      - {category: "Chladící soustava", path: "Auto-moto > Autochemie > Chladicí soustava"}
      - {category: "Brzdová soustava|Výfukový systém", path: "Auto-moto > Autochemie > Brzdy a výfuk"}
      - {category: "Maziva a oleje", path: "Auto-moto > Autochemie > Maziva a oleje"}
      - {category: "Zimní produkty|Ostřikovače", path: "Auto-moto > Autochemie > Zimní produkty a ostřikovače"}
      - {category: "Rychlá oprava defektu|Opravné sady", path: "Auto-moto > Autochemie > Opravy a defekty"}
      - {category: "Barvy, laky a nástřiky", path: "Auto-moto > Autochemie > Barvy a nástřiky"}
      - {category: "Čističe|GOOP", path: "Auto-moto > Autochemie > Čističe a odmašťovače"}
      # --- Tmely, lepidla a pásky
      - {category: "Tmely, pásky a lepidla", path: "Auto-moto > Tmely, lepidla a pásky"}
      # --- ostatní
      - {category: "Autodoplňky|Elektroinstalace|Přečerpávací hadice", path: "Auto-moto > Autodoplňky"}
      # --- položky jen se štítkem (VÝPRODEJ, PŘIPRAVUJEME, PROMO) – podle názvu
      - {name: "MOTIP|Bumperspray|lak na|nástřik", path: "Auto-moto > Autochemie > Barvy a nástřiky"}
      - {name: "Color Wax|vosk|autolak|kabriolet|pneumatik", path: "Auto-moto > Autokosmetika"}
      - {name: "výfuk", path: "Auto-moto > Autochemie > Brzdy a výfuk"}
      - {name: "chladič", path: "Auto-moto > Autochemie > Chladicí soustava"}
      - {name: "tmel|pájka|lepidl|pásk", path: "Auto-moto > Tmely, lepidla a pásky"}
      - {name: "čištění rukou|čistič", path: "Auto-moto > Autochemie > Čističe a odmašťovače"}
      - {name: "olej|mazivo", path: "Auto-moto > Autochemie > Maziva a oleje"}
    fallback_category: "Ke kontrole"

  # Šablona pro dalšího dodavatele (stačí zkopírovat, upravit a nastavit enabled: true).
  # Častý formát je Heureka XML – pak vypadá mapování takto:
  sablona-heureka:
    enabled: false
    supplier_name: "Dodavatel X"
    item_tag: SHOPITEM
    fields:
      code: ITEM_ID
      ean: EAN
      name: PRODUCTNAME
      description: DESCRIPTION
      manufacturer: MANUFACTURER
      image: IMGURL
      stock: STOCK_QUANTITY
      purchase_price: PRICE
      rrp: PRICE_VAT
      vat: VAT
      category: CATEGORYTEXT
    categories:
      - {category: "Autodoplňky", path: "Auto-moto > Autodoplňky"}
